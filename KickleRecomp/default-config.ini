# NESRecomp cycle-backend settings: the launcher, the in-game menu and the
# window write this file. Keys are SDL key and controller names.
[Display]
WindowScale = 3
Fullscreen = 0
IntegerScale = 1
LinearFilter = 0
[Audio]
Enabled = 1
Volume = 100
[Input]
Player1Source = 2
Player1Device = 
Player1Deadzone = 30
Player2Source = 2
Player2Device = 
Player2Deadzone = 30
[Launcher]
SkipLauncher = 0
[FDS]
# on, off, or default (the game's own setting)
AutoSwap = default
FastLoad = default
# the FDS BIOS file, any name (checked by size and CRC); empty: the launcher asks for it
Bios = 
[Keyboard.Player1]
a = Z
b = X
select = \
start = Return
up = Up
down = Down
left = Left
right = Right
[Gamepad.Player1]
a = a
b = x
select = back
start = start
up = dpup
down = dpdown
left = dpleft
right = dpright
[Keyboard.Player2]
a = None
b = None
select = None
start = None
up = None
down = None
left = None
right = None
[Gamepad.Player2]
a = a
b = x
select = back
start = start
up = dpup
down = dpdown
left = dpleft
right = dpright
[Keyboard.Shortcuts]
disk = D
menu = Escape
fast_forward = Tab
screenshot = F12
